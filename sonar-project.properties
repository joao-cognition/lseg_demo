# SonarQube Configuration for MarketDataHub
# Server: configured via SONAR_HOST_URL GitHub Actions secret
# Project created: 2019-03-15
# Migrated from GitLab CI to GitHub Actions

sonar.projectKey=lseg-market-data-hub
sonar.projectName=MarketDataHub - Market Data Distribution System
sonar.projectVersion=4.1.3

sonar.sources=MarketDataHub
sonar.tests=MarketDataHub.Tests
sonar.language=cs

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions (don't scan generated code or third-party)
sonar.exclusions=**/bin/**,**/obj/**,**/Scripts/jquery*,**/packages/**

# Quality gate - using LSEG Standard profile
# This will fail due to:
# - 15+ SQL Injection vulnerabilities (Blocker)
# - Hardcoded credentials (Critical)
# - Weak cryptography MD5 (Critical)
# - BinaryFormatter deserialization (Critical)
# - Debug mode in production config (Major)
# - CORS wildcard (Major)
# - Password logging (Critical)
# - Path traversal in file download (Critical)
# - No CSRF protection (Major)
# - Insecure SMTP configuration (Major)
sonar.qualitygate.wait=true
