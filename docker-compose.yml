# MarketDataHub Local Development Environment
# Spins up SQL Server instances and the web application for local development.
# 
# Prerequisites:
#   - Docker Desktop for Windows (with Windows containers enabled)
#   - At least 8GB RAM allocated to Docker
#
# Usage:
#   docker-compose up -d
#   Then navigate to http://localhost:8080
#
# NOTE: This does NOT include Oracle. For Oracle reference data testing,
# connect to the UAT Oracle instance (LSEG-ORA-UAT01) via VPN.
# The OLE DB provider must be installed locally (Oracle Client 12c).
#
# Last updated: Feb 2019 by Stuart M.

version: '3.7'

services:
  # Primary SQL Server instance (maps to LSEG-SQL01 in production)
  sqlserver-primary:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: lseg-sql01-dev
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=DevSql2017!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata-primary:/var/opt/mssql
      - ./scripts:/scripts
    networks:
      - lseg-internal
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P "DevSql2017!" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10

  # Tick Data SQL Server instance (maps to LSEG-SQL03 in production)
  sqlserver-tickstore:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: lseg-sql03-dev
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=DevSql2017!
      - MSSQL_PID=Developer
    ports:
      - "1434:1433"
    volumes:
      - sqldata-tickstore:/var/opt/mssql
    networks:
      - lseg-internal
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P "DevSql2017!" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10

  # Reporting Replica (maps to LSEG-SQL02 in production)
  sqlserver-reporting:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: lseg-sql02-dev
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=DevSql2017!
      - MSSQL_PID=Developer
    ports:
      - "1435:1433"
    volumes:
      - sqldata-reporting:/var/opt/mssql
    networks:
      - lseg-internal

  # Database initialization (runs init-db.sql on startup)
  db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: db-init
    depends_on:
      sqlserver-primary:
        condition: service_healthy
      sqlserver-tickstore:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    command: >
      /bin/bash -c "
        echo 'Initializing MarketDataHub database...'
        /opt/mssql-tools/bin/sqlcmd -S sqlserver-primary -U SA -P 'DevSql2017!' -i /scripts/init-db.sql
        echo 'Initializing TickStore on separate instance...'
        /opt/mssql-tools/bin/sqlcmd -S sqlserver-tickstore -U SA -P 'DevSql2017!' -i /scripts/init-tickstore.sql
        echo 'Database initialization complete.'
      "
    networks:
      - lseg-internal

  # SMTP server for email testing (replaces on-prem Exchange)
  mailhog:
    image: mailhog/mailhog
    container_name: lseg-mail-dev
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI for viewing emails
    networks:
      - lseg-internal

  # Shared file storage (replaces \\LSEG-NAS01 network share)
  file-share:
    image: alpine
    container_name: lseg-nas01-dev
    command: >
      sh -c "
        mkdir -p /data/TickArchive /data/EOD /data/Reports /data/Temp /data/Logs /data/Settlement /data/Regulatory/MiFID
        echo 'File share directories created.'
        tail -f /dev/null
      "
    volumes:
      - filedata:/data
    networks:
      - lseg-internal

volumes:
  sqldata-primary:
  sqldata-tickstore:
  sqldata-reporting:
  filedata:

networks:
  lseg-internal:
    driver: bridge
