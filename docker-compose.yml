# MarketDataHub - On-Premises Docker Compose
# This is used for the local development environment ONLY.
# Production runs on dedicated Windows Servers with IIS.
# 
# Prerequisites:
#   - Docker Desktop for Windows with Windows Containers mode
#   - Access to MDH internal network for feed connectivity
#
# Usage:
#   docker-compose up -d
#   Then open http://localhost:8080

version: '3.7'

services:
  # SQL Server - Primary database (mirrors MDH-SQL01)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: mdh-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=DevSql!2019
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mdh-network

  # SQL Server - Tick Data Store (mirrors MDH-SQL03)
  sqlserver-ticks:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: mdh-sqlserver-ticks
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=DevTick!2019
      - MSSQL_PID=Developer
    ports:
      - "1434:1433"
    volumes:
      - tickdata:/var/opt/mssql
    networks:
      - mdh-network

  # Application (IIS)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mdh-web
    ports:
      - "8080:80"
    depends_on:
      - sqlserver
      - sqlserver-ticks
    environment:
      - ConnectionStrings__MarketDataDb=Server=sqlserver;Database=MarketDataHub;User Id=sa;Password=DevSql!2019;
      - ConnectionStrings__TickDataDb=Server=sqlserver-ticks;Database=TickStore;User Id=sa;Password=DevTick!2019;
      - ConnectionStrings__ReportingDb=Server=sqlserver;Database=MarketDataHub;User Id=sa;Password=DevSql!2019;
    volumes:
      - filedata:/app/data
    networks:
      - mdh-network

volumes:
  sqldata:
  tickdata:
  filedata:

networks:
  mdh-network:
    driver: bridge
